services:
  backend:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 \
            PYTHONUNBUFFERED=1 \
            PIP_NO_CACHE_DIR=1
        WORKDIR /app
        RUN apt-get update \
            && apt-get install -y --no-install-recommends curl ca-certificates \
            && rm -rf /var/lib/apt/lists/*
        COPY backend/requirements.txt backend/requirements.txt
        RUN pip install -r backend/requirements.txt
        COPY backend backend
        COPY scripts scripts
    environment:
      USE_TURSO: ${USE_TURSO:-false}
      WNBA_DATA_DIR: ${WNBA_DATA_DIR:-/data}
      WNBA_DB_PATH: ${WNBA_DB_PATH:-/data/wnba.sqlite}
      WNBA_CACHE_DIR: ${WNBA_CACHE_DIR:-/data/cache}
      WNBA_SNAPSHOT_DIR: ${WNBA_SNAPSHOT_DIR:-/data/snapshots}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      ENV: ${ENV:-prod}
      API_KEY: ${API_KEY:-}
      EXPOSE_DEBUG_HEADERS: ${EXPOSE_DEBUG_HEADERS:-false}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      SPORTSDATAIO_API_KEY: ${SPORTSDATAIO_API_KEY:-}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      RATE_LIMIT_MUTATION_CAPACITY: ${RATE_LIMIT_MUTATION_CAPACITY:-10}
      RATE_LIMIT_MUTATION_REFILL_PER_SEC: ${RATE_LIMIT_MUTATION_REFILL_PER_SEC:-0.5}
      RATE_LIMIT_REFRESH_CAPACITY: ${RATE_LIMIT_REFRESH_CAPACITY:-6}
      RATE_LIMIT_REFRESH_REFILL_PER_SEC: ${RATE_LIMIT_REFRESH_REFILL_PER_SEC:-0.33}
      PORT: ${BACKEND_PORT_INTERNAL:-8010}
    command:
      - /bin/sh
      - -c
      - mkdir -p "$$WNBA_DATA_DIR" "$$WNBA_CACHE_DIR" "$$WNBA_SNAPSHOT_DIR" && python scripts/init_db.py && exec python -m uvicorn backend.app.main:app --host 0.0.0.0 --port "$$PORT"
    volumes:
      - wnba_data:/data
    expose:
      - "${BACKEND_PORT_INTERNAL:-8010}"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app/frontend
        COPY frontend/package.json frontend/package-lock.json ./
        RUN npm ci
        COPY frontend ./
        RUN npm run build

        FROM nginx:1.27-alpine
        COPY deploy/nginx-compose.conf /etc/nginx/conf.d/default.conf
        COPY deploy/frontend-runtime-config.sh /docker-entrypoint.d/40-runtime-config.sh
        RUN chmod +x /docker-entrypoint.d/40-runtime-config.sh
        COPY --from=build /app/frontend/dist /usr/share/nginx/html
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    init: true
volumes:
  wnba_data:
    name: ${WNBA_DOCKER_VOLUME_NAME:-wnbastats-data}
