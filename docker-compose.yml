services:
  backend:
    image: python:3.12-slim
    working_dir: /workspace
    command: ["/bin/sh", "/workspace/deploy/backend-entrypoint.sh"]
    environment:
      USE_TURSO: ${USE_TURSO:-false}
      WNBA_DATA_DIR: ${WNBA_DATA_DIR:-/data}
      WNBA_DB_PATH: ${WNBA_DB_PATH:-/data/wnba.sqlite}
      WNBA_CACHE_DIR: ${WNBA_CACHE_DIR:-/data/cache}
      WNBA_SNAPSHOT_DIR: ${WNBA_SNAPSHOT_DIR:-/data/snapshots}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      ENV: ${ENV:-prod}
      API_KEY: ${API_KEY:-}
      EXPOSE_DEBUG_HEADERS: ${EXPOSE_DEBUG_HEADERS:-false}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      SPORTSDATAIO_API_KEY: ${SPORTSDATAIO_API_KEY:-}
      ODDSPAPI_KEY: ${ODDSPAPI_KEY:-}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      RATE_LIMIT_MUTATION_CAPACITY: ${RATE_LIMIT_MUTATION_CAPACITY:-10}
      RATE_LIMIT_MUTATION_REFILL_PER_SEC: ${RATE_LIMIT_MUTATION_REFILL_PER_SEC:-0.5}
      RATE_LIMIT_REFRESH_CAPACITY: ${RATE_LIMIT_REFRESH_CAPACITY:-6}
      RATE_LIMIT_REFRESH_REFILL_PER_SEC: ${RATE_LIMIT_REFRESH_REFILL_PER_SEC:-0.33}
      PORT: ${BACKEND_PORT_INTERNAL:-8010}
    volumes:
      - ./:/workspace
      - backend_venv:/workspace/.venv
      - backend_pip_cache:/root/.cache/pip
      - wnba_data:/data
    expose:
      - "${BACKEND_PORT_INTERNAL:-8010}"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend-build:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: ["/bin/sh", "/workspace/deploy/frontend-build.sh"]
    environment:
      VITE_API_KEY: ${VITE_API_KEY:-}
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_dist:/dist
    restart: unless-stopped
    init: true
  frontend:
    image: nginx:1.27-alpine
    command:
      - /bin/sh
      - -c
      - cp /workspace/deploy/nginx-compose.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    depends_on:
      - backend
      - frontend-build
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./:/workspace:ro
    restart: unless-stopped
    init: true
volumes:
  backend_pip_cache:
  backend_venv:
  frontend_dist:
  frontend_node_modules:
  wnba_data:
